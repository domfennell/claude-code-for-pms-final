<style>
:root{
  --bg:#070a12; --bg2:#0a0e1a;
  --panel: rgba(13,18,32,0.82);
  --ink:#e8edf5; --muted:#8696ae;
  --cyan:#2dd4bf; --cyan-dim: rgba(45,212,191,0.35);
  --violet:#8b5cf6; --amber:#ffb020; --amber-dim: rgba(255,176,32,0.35);
  --red:#ff5a5a; --green:#34d399;
  --glass-border: rgba(45,212,191,0.4);
}
* { box-sizing: border-box; }
html,body { height: 100%; }
body{
  margin:0;
  font-family:"Rajdhani",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  padding-bottom: 96px;
  position:relative;
  overflow-x:hidden;
}
.mono{ font-family:"Share Tech Mono",monospace; }

/* ---------- Aurora + scanline ambient background ---------- */
.aurora{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.aurora span{ position:absolute; border-radius:50%; filter: blur(70px); opacity:.35; mix-blend-mode: screen; }
.aurora .a1{ width:60vw; height:60vw; left:-15vw; top:-20vw; background: var(--cyan); animation: drift1 26s ease-in-out infinite; }
.aurora .a2{ width:50vw; height:50vw; right:-18vw; top:10vh; background: var(--violet); animation: drift2 32s ease-in-out infinite; }
.aurora .a3{ width:45vw; height:45vw; left:20vw; bottom:-20vh; background: var(--amber); opacity:.22; animation: drift3 38s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(6vw,8vh) scale(1.15); } }
@keyframes drift2{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-8vw,6vh) scale(1.1); } }
@keyframes drift3{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(5vw,-6vh) scale(1.2); } }
.scanlines{ position:fixed; inset:0; z-index:1; pointer-events:none; background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 2px, transparent 3px); opacity:.5; }
.vignette{ position:fixed; inset:0; z-index:1; pointer-events:none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%); }

.topbar{ padding: 18px 18px 10px; position:relative; z-index:5; }
.title-strip{ max-width: 980px; margin: 0 auto 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand{ color: var(--cyan); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-family:"Share Tech Mono",monospace; opacity:.9; }
.brand .blip{ display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--cyan); margin-right:7px; box-shadow:0 0 8px var(--cyan); animation: blipPulse 1.6s ease-in-out infinite; }
@keyframes blipPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

.progress-track{ max-width:980px; margin:0 auto 14px; height:7px; background: rgba(255,255,255,0.06); border:1px solid rgba(45,212,191,0.3); border-radius:3px; overflow:hidden; position:relative; }
.progress-track::after{ content:""; position:absolute; inset:0; background: repeating-linear-gradient(90deg, transparent 0 18px, rgba(255,255,255,0.05) 18px 19px); }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--cyan), #7df9e8); box-shadow:0 0 10px var(--cyan); transition: width .3s ease; }

.breadcrumb{ max-width:980px; margin:0 auto; display:flex; gap:8px; flex-wrap:wrap; }
.crumb{
  font-family:"Share Tech Mono",monospace; font-weight:400; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  padding:7px 16px; background: rgba(255,255,255,0.04); color: var(--muted); border:1px solid rgba(255,255,255,0.14);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  cursor:pointer; user-select:none; transition: all .15s ease;
}
.crumb:hover{ border-color: var(--cyan); color:#fff; }
.crumb.active{ background: rgba(45,212,191,0.15); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 14px rgba(45,212,191,0.35); }
.crumb.done{ background: rgba(52,211,153,0.1); color: var(--green); border-color: rgba(52,211,153,0.4); }

.stage-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding: 10px 18px 14px; position:relative; z-index:5; }
.panel{
  width:100%; max-width: 920px; height: min(560px, 64vh);
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border); border-radius: 6px;
  box-shadow: 0 0 50px rgba(45,212,191,0.12), inset 0 0 60px rgba(0,0,0,0.3);
  padding: 34px 36px; position:relative; overflow-y:auto; overflow-x:hidden;
}
.hud-corner{ position:absolute; width:22px; height:22px; border: 2px solid var(--cyan); opacity:.75; pointer-events:none; }
.hud-corner.tl{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.hud-corner.tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
.hud-corner.bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; }
.hud-corner.br{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

.subcounter{ position:absolute; top:16px; right:20px; font-family:"Share Tech Mono",monospace; font-size:11px; color: var(--cyan); background: rgba(45,212,191,0.08); border:1px solid var(--cyan-dim); border-radius:3px; padding:4px 11px; letter-spacing:.04em; }
.section-dots{ position:absolute; top:46px; right:20px; display:flex; gap:7px; align-items:center; }
.section-dots .dot{ width:9px; height:9px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.3); background: transparent; cursor:pointer; padding:0; transition: all .15s ease; }
.section-dots .dot:hover{ border-color: var(--cyan); }
.section-dots .dot.filled{ background: var(--green); border-color: var(--green); }
.section-dots .dot.current{ width:11px; height:11px; background: var(--cyan); border-color: var(--cyan); box-shadow:0 0 8px var(--cyan); animation: blipPulse 1.4s ease-in-out infinite; cursor:default; }

.navbar-fixed{ position:fixed; left:0; right:0; bottom:0; z-index:20; background: rgba(7,10,18,0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--glass-border); box-shadow: 0 -8px 24px rgba(0,0,0,0.4); }
.navbar{ max-width:980px; margin: 0 auto; padding: 14px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
.nav-btn{
  font-family:"Share Tech Mono",monospace; font-weight:400; font-size:13.5px; letter-spacing:.06em; text-transform:uppercase;
  background: rgba(45,212,191,0.08); color: var(--cyan); border:1px solid var(--cyan); padding:11px 24px; cursor:pointer;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);

}
.nav-btn:hover:not(:disabled){ background: rgba(45,212,191,0.2); box-shadow:0 0 14px rgba(45,212,191,0.4); }
.nav-btn:active:not(:disabled){ transform: scale(.97); }
.nav-btn:disabled{ opacity:.25; cursor:not-allowed; }
.nav-count{ color: var(--muted); font-family:"Share Tech Mono",monospace; font-size:12px; letter-spacing:.05em; }

h1.slide-title{ font-size: clamp(24px, 3.6vw, 34px); font-weight:700; color:#fff; margin: 0 0 14px; line-height:1.15; letter-spacing:.01em; }
h2.slide-title{ font-size: clamp(20px, 3vw, 27px); font-weight:700; color:#fff; margin: 0 0 14px; letter-spacing:.01em; }
p.sub{ color: var(--muted); font-size:14.5px; margin:0 0 20px; max-width:640px; }
.stamp-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.stamp{
  font-family:"Share Tech Mono",monospace; font-weight:400; font-size:11.5px; letter-spacing:.05em; color: var(--cyan);

  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:680px){ .grid2{ grid-template-columns:1fr; } }
.comic-panel{ background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-left: 3px solid var(--cyan); padding:16px 18px; position:relative; }
.comic-panel .frame-no{ position:absolute; top:10px; right:12px; font-family:"Share Tech Mono",monospace; font-size:11px; color: var(--cyan); opacity:.6; }
.comic-panel h4{ margin:4px 24px 8px 0; font-size:15.5px; color:#fff; font-weight:700; }
.comic-panel p{ margin:0; font-size:13.5px; color: var(--muted); line-height:1.55; }
.comic-panel code{ background:rgba(255,255,255,0.08); color: var(--cyan); padding:1px 5px; border-radius:3px; font-size:12px; font-family:"Share Tech Mono",monospace; }
.loop-caption, .chart-caption{ font-size:12.5px; color: var(--muted); text-align:center; margin-top:12px; max-width:480px; margin-left:auto; margin-right:auto; }

.module-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.issue-no{ width:50px; height:50px; border:1.5px solid var(--cyan); color: var(--cyan); font-family:"Share Tech Mono",monospace; font-size:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background: rgba(45,212,191,0.06); clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
.module-head h2{ margin:0; font-size:22px; color:#fff; font-weight:700; }
.finding-box{ background: rgba(255,176,32,0.08); border:1px solid var(--amber-dim); border-left:3px solid var(--amber); border-radius:4px; padding:12px 14px; margin-bottom:16px; font-size:13.5px; color:#f3deb0; font-weight:500; line-height:1.5; }
.finding-tag{ display:inline-block; font-family:"Share Tech Mono",monospace; font-size:11px; letter-spacing:.1em; color: var(--amber); margin-bottom:6px; }
.prompt-tag{ font-family:"Share Tech Mono",monospace; font-weight:400; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color: var(--muted); margin:0 0 8px; display:flex; align-items:center; gap:7px; }
.prompt-tag::before{ content:""; width:7px; height:7px; border-radius:50%; background: var(--red); box-shadow:0 0 6px var(--red); animation: blipPulse 1.1s ease-in-out infinite; }
.speech-bubble{ position:relative; background: rgba(0,0,0,0.35); color:#cdebe6; border:1px solid rgba(45,212,191,0.3); border-left:3px solid var(--cyan); border-radius:3px; padding:14px 16px; font-family:"Share Tech Mono",monospace; font-size:12.5px; line-height:1.65; white-space:pre-wrap; }
.empty-note{ font-style:italic; color: var(--muted); }

.fix-callout{ background: rgba(52,211,153,0.08); color:#bdf5de; border:1px solid rgba(52,211,153,0.4); border-left:3px solid var(--green); border-radius:4px; padding:14px 16px; font-weight:600; font-size:13.5px; margin-bottom:18px; line-height:1.5; }
.fix-points{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
@media (max-width:680px){ .fix-points{ grid-template-columns:repeat(2,1fr); } }
.fix-point{ background: rgba(255,255,255,0.03); border:1px solid rgba(45,212,191,0.25); padding:12px 8px; text-align:center; clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.fix-point .emoji{ font-size:20px; display:block; margin-bottom:5px; filter: grayscale(.2); }
.fix-point .label{ font-size:11px; font-weight:600; color: var(--ink); font-family:"Share Tech Mono",monospace; letter-spacing:.01em; }
.scope-note{ font-size:12px; color: var(--muted); text-align:center; border:1px dashed rgba(255,255,255,0.2); border-radius:4px; padding:10px 14px; font-family:"Share Tech Mono",monospace; }

.proto-preview{ display:grid; grid-template-columns:1.3fr .9fr; gap:16px; margin: 16px 0; }
@media (max-width:680px){ .proto-preview{ grid-template-columns:1fr; } }
.mini-card{ background: rgba(255,255,255,0.03); border:1px solid rgba(45,212,191,0.25); padding:16px; }
.mini-head{ font-size:11px; font-family:"Share Tech Mono",monospace; text-transform:uppercase; letter-spacing:.08em; color: var(--muted); margin:0 0 12px; }
.pp-row{ display:flex; align-items:center; gap:10px; }
.pp-avatar{ width:34px; height:34px; border:1.5px solid var(--cyan); color: var(--cyan); background: rgba(45,212,191,0.08); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:"Share Tech Mono",monospace; }
.pp-name{ font-weight:700; font-size:14.5px; color:#fff; }
.pp-area{ font-size:12px; color: var(--muted); }
.pp-chip{ margin-left:auto; background: rgba(52,211,153,0.15); color: var(--green); border:1px solid var(--green); font-weight:600; font-size:10.5px; font-family:"Share Tech Mono",monospace; padding:3px 9px; visibility:hidden; letter-spacing:.04em; }
.pp-chip.show{ visibility:visible; }
.pp-score{ font-size:11px; color: var(--muted); margin-top:6px; font-weight:600; font-family:"Share Tech Mono",monospace; }
.pp-phone{ width:150px; margin:0 auto; border:4px solid rgba(255,255,255,0.25); border-radius:18px; background: rgba(0,0,0,0.4); padding:18px 10px 10px; position:relative; min-height:140px; }
.pp-phone::before{ content:""; position:absolute; top:7px; left:50%; transform:translateX(-50%); width:38px; height:6px; background: rgba(255,255,255,0.25); border-radius:5px; }
.pp-callout{ background: rgba(255,176,32,0.12); border:1px solid var(--amber-dim); border-radius:4px; padding:8px; font-size:10.5px; font-weight:600; margin-bottom:7px; color:#f3deb0; display:none; }
.pp-callout.show{ display:block; }
.pp-quiet{ font-size:10.5px; color: var(--muted); text-align:center; margin-top:30px; font-family:"Share Tech Mono",monospace; }
.pp-quiet.hide{ display:none; }
.pp-note{ background: rgba(52,211,153,0.12); color:#bdf5de; border:1px solid rgba(52,211,153,0.4); border-radius:4px; padding:8px; font-size:9.5px; line-height:1.4; display:none; }
.pp-note.show{ display:block; }
.open-btn{
  display:block; text-align:center; background: rgba(255,90,90,0.1); color: var(--red); text-decoration:none; font-weight:600;
  font-family:"Share Tech Mono",monospace; font-size:13.5px; letter-spacing:.04em; text-transform:uppercase; padding:13px 18px;
  border:1px solid var(--red); clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.open-btn:hover{ background: rgba(255,90,90,0.2); box-shadow:0 0 14px rgba(255,90,90,0.3); }
.toggle-btn{
  display:block; margin:0 auto 18px; font-family:"Share Tech Mono",monospace; font-weight:400; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
  background: rgba(45,212,191,0.1); color: var(--cyan); border:1px solid var(--cyan); padding:10px 22px; cursor:pointer;
  clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);

footer{ text-align:center; color: var(--muted); font-size:11px; font-family:"Share Tech Mono",monospace; padding: 10px 18px 26px; opacity:.7; position:relative; z-index:5; }
code.inline{ background: rgba(255,255,255,0.08); color: var(--cyan); padding:1px 6px; border-radius:3px; font-size:12px; font-family:"Share Tech Mono",monospace; }

/* ---------- Intro: dispatch-radio tuning sequence ---------- */
.intro-seq{ position:relative; min-height: 220px; }
.intro-static{
  position:absolute; inset:0; z-index:1;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.08) 0px, transparent 1px, transparent 3px),
              repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, transparent 2px, transparent 5px);

@keyframes staticFade{ 0%{ opacity:.9; } 70%{ opacity:.5; } 100%{ opacity:0; pointer-events:none; } }
@keyframes staticFlicker{ 0%{ transform: translateY(0); } 100%{ transform: translateY(-2px); } }

.freq-readout{

}
@keyframes freqShow{ to{ opacity:1; } }
.freq-label{ position:relative; z-index:2; font-family:"Share Tech Mono",monospace; color: var(--muted); font-size:11px; letter-spacing:.2em; text-align:center; text-transform:uppercase; opacity:0; animation: freqShow .25s ease .15s forwards; margin-bottom:12px; }

.squelch{
  position:absolute; left:50%; top:46%; width:4px; height:4px; z-index:3; pointer-events:none;

@keyframes squelchBurst{

  60%{ width:900px; height:900px; opacity:.5; }
  100%{ width:1400px; height:1400px; opacity:0; }
}

.intro-title-wrap{ position:relative; z-index:2; text-align:center; opacity:0; animation: titleIn .5s ease 1.85s forwards; }
@keyframes titleIn{ 0%{ opacity:0; transform: scale(.96); } 60%{ opacity:1; } 100%{ opacity:1; transform: scale(1); } }
.intro-title{
  font-family:"Rajdhani",sans-serif; font-weight:700; font-size: clamp(22px,3.6vw,32px); color:#fff; margin:0 0 4px;
  letter-spacing:.01em; line-height:1.15; text-shadow: 0 0 30px rgba(45,212,191,0.5);
}
.intro-callsign{ font-family:"Share Tech Mono",monospace; color: var(--cyan); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; margin-bottom:10px; }
.intro-sub{ opacity:0; animation: fadeUp .6s ease 2.25s forwards; }
.intro-stamps{ opacity:0; animation: fadeUp .6s ease 2.5s forwards; }
@keyframes fadeUp{ 0%{ opacity:0; transform: translateY(8px); } 100%{ opacity:1; transform: translateY(0); } }
</style>

function traceOldRule(pings){ let score=0.5; const t=[]; for (const [ts,o] of pings){ score += o==="taken"?0.08:-0.12; score=Math.max(0,Math.min(1,score)); t.push({t:new Date(ts),score}); } return t; }
function traceNewRule(pings){ let score=0.5; let last=new Date(pings[0][0]); const t=[]; const D=0.015,F=0.15;
  for (const [ts,o] of pings){ const now=new Date(ts); const idle=(now-last)/86400000; score += Math.sign(0.5-score)*Math.min(Math.abs(0.5-score),D*idle);
    if(o==="taken") score+=0.08; else if(o==="turned down") score-=0.12; else score-=0.04; score=Math.max(F,Math.min(1,score)); last=now; t.push({t:now,score}); }
  return t; }

  const sec = slides[idx].section;
  const inSection = slides.map((s,i)=>i).filter(i=>slides[i].section===sec);
  return { sec, pos: inSection.indexOf(idx)+1, total: inSection.length, first: inSection[0], indices: inSection };
}

const FREQS = ['088.1 FM','091.7 FM','096.3 FM','099.5 FM','104.2 FM'];
function runFreqTicker(){
  const el = document.getElementById('freq-readout');
  if (!el) return;
  let i = 0;
  const iv = setInterval(()=>{
    i++;
    if (i >= FREQS.length) { clearInterval(iv); return; }
    el.textContent = FREQS[i];
  }, 220);
}

function render(){
  const s = slides[current];
  document.getElementById('slide-content').innerHTML = s.html;
  document.getElementById('panel').scrollTop = 0;

  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  SECTIONS.forEach(sec=>{
    const el = document.createElement('div');
    const firstIdx = slides.findIndex(sl=>sl.section===sec.key);
    const lastIdx = slides.map((sl,i)=>i).filter(i=>slides[i].section===sec.key).slice(-1)[0];
    el.className = 'crumb' + (sec.key===s.section ? ' active' : (current>lastIdx ? ' done' : ''));
    el.textContent = sec.label;
    el.onclick = ()=>{ current = firstIdx; render(); };
    bc.appendChild(el);
  });

  const info = sectionInfo(current);
  const sc = document.getElementById('subcounter');
  if (info.total > 1) {
    sc.style.display = 'inline-block';
    sc.textContent = SECTIONS.find(x=>x.key===info.sec).label + ' — ' + info.pos + ' of ' + info.total;
  } else {
    sc.style.display = 'none';
  }

  const dotsWrap = document.getElementById('section-dots');
  if (info.total > 1) {
    dotsWrap.style.display = 'flex';
    dotsWrap.innerHTML = '';
    info.indices.forEach(slideIdx=>{
      const d = document.createElement('button');
      d.className = 'dot' + (slideIdx===current ? ' current' : (slideIdx<current ? ' filled' : ''));
      d.setAttribute('aria-label', 'Go to slide ' + (slideIdx+1));
      if (slideIdx!==current) d.onclick = ()=>{ current = slideIdx; render(); };
      dotsWrap.appendChild(d);
    });
  } else {
    dotsWrap.style.display = 'none';
  }

  document.getElementById('progress-fill').style.width = (((current+1)/slides.length)*100) + '%';
  document.getElementById('slide-tag').textContent = 'SLIDE ' + (current+1) + ' / ' + slides.length;
  document.getElementById('nav-count').textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('prev-btn').disabled = current===0;
  document.getElementById('next-btn').disabled = current===slides.length-1;

  protoAfter = false;
  renderProtoSlide();
  runFreqTicker();
}

document.getElementById('prev-btn').onclick = ()=>{ if(current>0){ current--; render(); } };
document.getElementById('next-btn').onclick = ()=>{ if(current<slides.length-1){ current++; render(); } };
document.addEventListener('keydown', (e)=>{
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
});

render();
</script>
